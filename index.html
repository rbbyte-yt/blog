<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="Adnan Hassan Rabbi — personal website.">
  <title>Adnan Hassan Rabbi</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f7f8;
      color: #171717;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    a {
      color: inherit;
      text-decoration: none;
      font-size: clamp(2rem, 7vw, 5.5rem);
      line-height: 1.12;
      font-weight: 650;
      letter-spacing: -0.055em;
      text-align: center;
      overflow-wrap: anywhere;
      transition: color .18s ease, transform .18s ease;
    }
    a:hover, a:focus-visible { color: #555; transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <a href="https://rabbi.qzz.io" aria-label="Visit Adnan Hassan Rabbi's website">Adnan Hassan Rabbi</a>
</body>
</html>
